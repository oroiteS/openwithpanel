name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # 用 xcode-27 托管镜像；macos-latest 是 macOS 26 + Xcode 26（Swift 6.3.3），
    # 编译不了 tools-version 6.4 的 OpenWithPanelKit
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # 工程要求 Xcode 27；镜像里默认的 Xcode 不一定是最新的那个
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Lint
        run: swift format lint --strict --recursive OpenWithPanelKit Apps

      - name: Test package
        run: swift test --package-path OpenWithPanelKit

      - name: Build app
        run: xcodebuild -project OpenWithPanel.xcodeproj -scheme OpenWithPanel -configuration Release build
