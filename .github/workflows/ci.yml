name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # 工程要求 Xcode 27；镜像里默认的 Xcode 不一定是最新的那个
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Lint
        run: swift format lint --strict --recursive OpenWithPanelKit Apps

      - name: Test package
        run: swift test --package-path OpenWithPanelKit

      - name: Build app
        run: xcodebuild -project OpenWithPanel.xcodeproj -scheme OpenWithPanel -configuration Release build
